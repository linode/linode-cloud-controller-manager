# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lb-created-with-reserved-ip-attached-to-nb
  labels:
    all:
    lke:
spec:
  namespace: "lb-created-with-reserved-ip-attached-to-nb"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -euo pipefail
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "lb-created-with-reserved-ip-attached-to-nb" | tail -100
  steps:
    - name: Create dummy service
      try:
        - apply:
            file: dummy-service.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Service
    
    - name: Check that loadbalancer ip is assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-dummy
            status:
              (loadBalancer.ingress[0].ip != null): true
    - name: create reserved ip and nodebalancer resources
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              reserved_ip=$(create_reserved_ip)
              create_cm=$(kubectl -n $NAMESPACE create configmap nb-config --from-literal=Reserved_IP=$reserved_ip -o yaml --dry-run=client | kubectl apply -f -)
              if [[ "$create_cm" != "configmap/nb-config created" ]]; then
                fail "Unable to create configmap. Error: $create_cm"
              fi
              LABEL="ccm-$(head /dev/urandom | tr -dc 'a-z0-9' | head -c 5)"
              data=$(KUBECONFIG=$KUBECONFIG NAMESPACE=$NAMESPACE LINODE_TOKEN=$LINODE_TOKEN LABEL=$LABEL REGION=$LINODE_REGION ../scripts/get-nb-create-data.sh svc-dummy)
              
              payload=$(echo "$data" | jq --arg key "ipv4" --arg value "$reserved_ip" '.[$key] = $value')
              
              id_re='^[0-9]+$'

              nb_id=$(create_nodebalancer "$payload")
              
              if ! [[ $nb_id =~ $id_re ]]; then
                  fail "Nodebalancer ID [$nb_id] is incorrect, failed to create nodebalancer"
              fi

              echo "{\"reserved_ip\": \"$reserved_ip\",
                      \"nb_id\": \"$nb_id\"}"

              if ! kubectl -n $NAMESPACE patch configmap nb-config --type merge -p "{\"data\":{\"NB_ID\":\"$nb_id\"}}" >/dev/null; then
                fail "Unable to update configmap"
              fi
            check:
              ($error == null): true
            outputs:
              - name: nb_conf
                value: (json_parse($stdout))
        - apply:
            file: create-pods-services.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service
      cleanup:
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              cleanup_error=""
              nb_id=$(kubectl get configmap nb-config -o=jsonpath='{.data.NB_ID}' -n "$NAMESPACE" 2>/dev/null || true)
              if [[ ! "$nb_id" =~ ^[0-9]+$ ]]; then
                cleanup_error="No valid NodeBalancer id found in configmap"
              elif linode_cli nodebalancers delete "$nb_id" --json >/dev/null 2>&1 \
                || linode_nodebalancer_absent "$nb_id"; then
                echo "NodeBalancer $nb_id deleted successfully"
              else
                cleanup_error="Unable to delete NodeBalancer $nb_id"
              fi

              # The reserved IP is attached to the NodeBalancer deleted above. This
              # is a negative test, so CCM never adopts svc-test and never releases
              # the reserved IP; release it here (best-effort) so it does not leak.
              primary_ip=$(kubectl get configmap nb-config -o=jsonpath='{.data.Reserved_IP}' -n $NAMESPACE 2>/dev/null || true)
              if ! [[ "$primary_ip" =~ ^[0-9.]+$ ]]; then
                cleanup_error="${cleanup_error:+$cleanup_error; }No reserved ip found in configmap"
              elif ! ../scripts/cleanup-reserved-ips.sh release "$primary_ip"; then
                cleanup_error="${cleanup_error:+$cleanup_error; }Unable to release reserved IP $primary_ip"
              fi

              delete_cm=$(kubectl delete configmap nb-config -n "$NAMESPACE" 2>&1) || true
              if [[ "$delete_cm" == *'configmap "nb-config" deleted'* ]]; then
                echo "Configmap deleted successfully"
              else
                cleanup_error="${cleanup_error:+$cleanup_error; }Unable to delete the configmap: $delete_cm"
              fi

              if [[ -n "$cleanup_error" ]]; then
                fail "$cleanup_error"
              fi
            check:
              ($error == null): true
    - name: Check that loadbalancer ip is assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-test
            status:
              (loadBalancer.ingress[0].ip == null): true
    - name: get service ip and compare with reserved ip
      try:
        - script: 
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              reserved_ip=$(kubectl get configmap nb-config -o=jsonpath='{.data.Reserved_IP}' -n $NAMESPACE)
              if [ -z "$reserved_ip" ]; then
                  fail "No reserved ip found in configmap"
              fi

              nb_id=$(kubectl get configmap nb-config -o=jsonpath='{.data.NB_ID}' -n $NAMESPACE)
              if [ -z "$nb_id" ]; then
                  fail "No nb id found in configmap"
              fi

              service_ip=$(kubectl get svc svc-test -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
              if [ "$service_ip" != "" ]; then
                  fail "Service ip found for service svc-test. Expected to be empty, got $service_ip"
              fi

              echo "{\"service_ip\": $service_ip}"
              echo "{\"reserved_ip\": $reserved_ip}"
              if [[ "$service_ip" == "$reserved_ip" ]]; then
                fail "Expected service IP to differ from reserved IP $reserved_ip"
              fi
              echo "IPs do not match"
            check:
              ($error == null): true
              
