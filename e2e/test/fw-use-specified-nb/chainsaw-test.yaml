# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: fw-use-specified-nb
  labels:
    all:
    lke:
spec:
  bindings:
    - name: fwname
      value: (join('-', ['ccm-fwtest', env('CLUSTER_NAME')]))
  namespace: "fw-use-specified-nb"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        env:
          - name: FWLABEL
            value: ($fwname)
        content: |
          set -uo pipefail
          source ../scripts/lib.sh
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "fw-use-specified-nb" | tail -100 || true

          # This test creates a Firewall directly via the Linode API, which chainsaw
          # does not track and will not auto-delete. If a step fails before the test
          # deletes it, the firewall would leak. Look it up by its (deterministic)
          # label and delete it here (best-effort, idempotent).
          echo "Cleaning up firewall (if any)..."
          fwid=$(linode_firewall_id_by_label "$FWLABEL" 2>/dev/null || true)
          if [[ "$fwid" =~ ^[0-9]+$ ]]; then
            echo "Deleting firewall $fwid"
            if ! linode_cli firewalls delete "$fwid" --json >/dev/null 2>&1 \
              && ! linode_firewall_absent "$fwid"; then
              echo "Unable to delete firewall $fwid during test cleanup" >&2
            fi
          fi
  steps:
    - name: Create firewall, Create pods and services
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            env:
              - name: FWLABEL
                value: ($fwname)
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              firewall_data=$(jq -cn --arg label "$FWLABEL" '{
                label: $label,
                rules: {
                  inbound: [{
                    action: "ACCEPT",
                    label: "inbound-rule123",
                    description: "inbound rule123",
                    ports: "4321",
                    protocol: "TCP",
                    addresses: {ipv4: ["0.0.0.0/0"]}
                  }],
                  inbound_policy: "ACCEPT",
                  outbound_policy: "ACCEPT"
                }
              }')
              fwid=$(create_firewall "$firewall_data")
              if [[ ! "$fwid" =~ ^[0-9]+$ ]]; then
                fail "Failed creating firewall: $fwid"
              fi
            check:
              ($error == null): true
        - apply:
            file: create-pods-services.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service
    - name: Check that loadbalancer ip is assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-test
            status:
              (loadBalancer.ingress[0].ip != null): true
    - name: Annotate service with nodebalancer id
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            env:
              - name: FWLABEL
                value: ($fwname)
            timeout: 3m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh
              re='^[0-9]+$'

              fwid=$(linode_firewall_id_by_label "$FWLABEL")

              if ! [[ $fwid =~ $re ]]; then
                  echo "Firewall id [$fwid] is incorrect, failed to fetch firewall"
                  exit 1
              fi

              kubectl annotate svc svc-test -n $NAMESPACE service.beta.kubernetes.io/linode-loadbalancer-firewall-id=$fwid
              nbid=$(KUBECONFIG=$KUBECONFIG NAMESPACE=$NAMESPACE LINODE_TOKEN=$LINODE_TOKEN ../scripts/get-nb-id.sh)
              firewall_attached_to_nodebalancer() {
                  local firewalls
                  firewalls=$(linode_firewalls_for_nodebalancer "$nbid") || return 1
                  jq -e --argjson id "$fwid" 'any(.[]; .id == $id)' <<< "$firewalls" >/dev/null
              }
              if ! retry 10 10 firewall_attached_to_nodebalancer; then
                  fail "Firewall $fwid was not attached to NodeBalancer $nbid after 10 attempts"
              fi

              if ! linode_cli firewalls delete "$fwid" --json >/dev/null; then
                  fail "Failed deleting firewall $fwid"
              fi
            check:
              ($error == null): true
