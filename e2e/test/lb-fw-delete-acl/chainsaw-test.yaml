# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lb-fw-delete-acl
  labels:
    all:
    lke:
spec:
  namespace: "lb-fw-delete-acl"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -euo pipefail
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "lb-fw-delete-acl" | tail -100
  steps:
    - name: Create pods and services
      try:
        - apply:
            file: create-pods-services.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service
    - name: Check that loadbalancer ip is assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-test
            status:
              (loadBalancer.ingress[0].ip != null): true
    - name: Fetch Nodebalancer ID, make sure it has firewall attached
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 3m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh
              nbid=$(KUBECONFIG=$KUBECONFIG NAMESPACE=$NAMESPACE LINODE_TOKEN=$LINODE_TOKEN ../scripts/get-nb-id.sh)
              if ! retry_jq 10 10 'select(length == 1 and any(.[0].rules.inbound[]?.addresses.ipv4[]?; . == "7.7.7.7/32"))' \
                linode_firewalls_for_nodebalancer "$nbid" >/dev/null; then
                fail "Firewall was not attached with the expected 7.7.7.7/32 rule after 10 attempts"
              fi

            check:
                ($error == null): true
    - name: Delete ACL and check that firewall no longer exists
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 6m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh
              nbid=$(KUBECONFIG=$KUBECONFIG NAMESPACE=$NAMESPACE LINODE_TOKEN=$LINODE_TOKEN ../scripts/get-nb-id.sh)
              firewalls=$(linode_firewalls_for_nodebalancer "$nbid")
              fwid=$(jq -er '.[0].id' <<< "$firewalls")
              kubectl patch service svc-test -n "$NAMESPACE" --type=json -p='[{"op": "remove", "path": "/metadata/annotations/service.beta.kubernetes.io~1linode-loadbalancer-firewall-acl"}]'

              firewall_detached_and_absent() {
                local current_firewalls
                current_firewalls=$(linode_firewalls_for_nodebalancer "$nbid") || return 1
                jq -e --argjson id "$fwid" 'all(.[]; .id != $id)' <<< "$current_firewalls" >/dev/null || return 1
                linode_firewall_absent "$fwid"
              }
              if ! retry 30 10 firewall_detached_and_absent; then
                fail "Firewall $fwid remained attached or undeleted after 30 attempts"
              fi

            check:
                ($error == null): true
    - name: Refresh service by adding the ACL again
      try:
        - apply:
            file: create-pods-services.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Service
    - name: Delete service and make sure nb and fw are deleted automatically
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 4m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh
              nbid=$(KUBECONFIG=$KUBECONFIG NAMESPACE=$NAMESPACE LINODE_TOKEN=$LINODE_TOKEN ../scripts/get-nb-id.sh)
              firewalls=$(retry_jq 10 2 'select(length > 0)' linode_firewalls_for_nodebalancer "$nbid")
              fwid=$(jq -er '.[0].id' <<< "$firewalls")

              kubectl delete service svc-test -n "$NAMESPACE" --ignore-not-found --wait=true --timeout=60s
              resources_absent() {
                linode_nodebalancer_absent "$nbid" && linode_firewall_absent "$fwid"
              }
              if ! retry 10 10 resources_absent; then
                fail "NodeBalancer $nbid and firewall $fwid were not deleted after 10 attempts"
              fi

            check:
                ($error == null): true
