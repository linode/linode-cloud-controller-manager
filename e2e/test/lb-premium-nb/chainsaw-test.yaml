# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lb-premium-nb
  labels:
    all:
spec:
  namespace: "lb-premium-nb"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -euo pipefail
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "lb-premium-nb" | tail -100
  steps:
    - name: Create pods and services
      try:
        - apply:
            file: create-pods-services.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service
    - name: Check that loadbalancer ip is assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-test
            status:
              (loadBalancer.ingress[0].ip != null): true
    - name: Fetch loadbalancer ip and check both pods reachable
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 10m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh
              IP=$(kubectl get svc svc-test -n "$NAMESPACE" -o json | jq -r .status.loadBalancer.ingress[0].ip)

              # Populated by observe_distinct_pods in lib.sh.
              podnames=()
              if ! retry 20 20 observe_distinct_pods "$IP:80"; then
                  fail "Expected responses from two distinct pods, observed ${#podnames[@]}"
              fi
            check:
              ($error == null): true
    - name: Check nodebalancer type
      try:
      - script:
          shell: bash
          shellArgs:
            - -c
          timeout: 2m
          content: |
            set -euo pipefail
            source ../scripts/lib.sh

            nbid=$(KUBECONFIG="$KUBECONFIG" NAMESPACE="$NAMESPACE" LINODE_TOKEN="$LINODE_TOKEN" ../scripts/get-nb-id.sh)
            if ! retry_jq 10 5 'select(.[0].type == "premium")' \
              linode_cli nodebalancers view "$nbid" --json >/dev/null; then
                fail "NodeBalancer type did not become premium after 10 attempts"
            fi
          check:
            ($error == null): true
