# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lb-tcp-connection-health-check
  labels:
    all:
    lke:
spec:
  namespace: "lb-tcp-connection-health-check"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -euo pipefail
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "lb-tcp-connection-health-check" | tail -100
  steps:
    - name: Create pods and services
      try:
        - apply:
            file: create-pods-services.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service
    - name: Check that loadbalancer ip is assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-test
            status:
              (loadBalancer.ingress[0].ip != null): true
    - name: Fetch nodebalancer config for port 80
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 10m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              nbid=$(KUBECONFIG=$KUBECONFIG NAMESPACE=$NAMESPACE LINODE_TOKEN=$LINODE_TOKEN ../scripts/get-nb-id.sh)

              echo "Nodebalancer ID: $nbid"

              if ! retry_jq 20 20 'select(any(.[]; .port == 80 and .check == "connection" and .check_interval == 10 and .check_timeout == 5 and .check_attempts == 4 and .protocol == "tcp" and (.nodes_status.up | tonumber) >= 2))' \
                linode_cli nodebalancers configs-list "$nbid" --json >/dev/null; then
                  fail "NodeBalancer config for port 80 did not satisfy the TCP connection health check after 20 attempts"
              fi

            check:
              ($error == null): true
