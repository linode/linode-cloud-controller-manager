# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lb-with-multiple-http-https-ports
  labels:
    all:
    lke:
spec:
  namespace: "lb-with-multiple-http-https-ports"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -euo pipefail
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "lb-with-multiple-http-https-ports" | tail -100
  steps:
    - name: Create pods and services
      try:
        - apply:
            file: create-pods-services.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service
    - name: Create secrets
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              kubectl -n "$NAMESPACE" create secret tls tls-secret-1 --cert=../certificates/server.crt --key=../certificates/server.key
              kubectl -n "$NAMESPACE" create secret tls tls-secret-2 --cert=../certificates/server.crt --key=../certificates/server.key
            check:
              ($error == null): true
    - name: Check TLS secrets exist
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: tls-secret-1
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: tls-secret-2
    - name: Check endpoints exist
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Endpoints
            metadata:
              name: svc-test
            (subsets[0].addresses != null): true
            (subsets[0].ports != null): true
            (length(subsets[0].ports)): 4
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service
    - name: Check that loadbalancer ip is assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-test
            status:
              (loadBalancer.ingress[0].ip != null): true
    - name: Fetch loadbalancer ip and check if pod reachable on different ports with different protocols
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 22m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh
              IP=$(kubectl get svc svc-test -n "$NAMESPACE" -o json | jq -r .status.loadBalancer.ingress[0].ip)
              echo "loadbalancer ip: $IP"

              all_ports_reachable() {
                  local port_80
                  local port_8080
                  local port_443
                  local port_8443
                  port_80=$(curl -fsS --max-time 10 "$IP:80" | grep "test-" || true)
                  port_8080=$(curl -fsS --max-time 10 "$IP:8080" | grep "test-" || true)
                  port_443=$(curl --fail --silent --max-time 10 \
                    --resolve "linode.test:443:$IP" \
                    --cacert ../certificates/ca.crt \
                    https://linode.test:443 | grep "test-" || true)
                  port_8443=$(curl --fail --silent --max-time 10 \
                    --resolve "linode.test:8443:$IP" \
                    --cacert ../certificates/ca.crt \
                    https://linode.test:8443 | grep "test-" || true)

                  [[ -n $port_80 && -n $port_8080 && -n $port_443 && -n $port_8443 ]]
              }

              if ! retry 20 20 all_ports_reachable; then
                  fail "Pods did not respond on all configured ports"
              fi
            check:
              ($error == null): true
