# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lb-with-ipv6-backends
  labels:
    ipv6-backends:
spec:
  namespace: "lb-with-ipv6-backends"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -euo pipefail
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "lb-with-ipv6-backends" | tail -100
  steps:
    - name: Create pods and service
      try:
        - apply:
            file: create-pods-services.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service
    - name: Check that loadbalancer ip is assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-test
            status:
              (loadBalancer.ingress[0].ip != null): true
    - name: Check NodeBalancer backend addresses are IPv6
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              nbid=$(KUBECONFIG=$KUBECONFIG NAMESPACE=$NAMESPACE LINODE_TOKEN=$LINODE_TOKEN ../scripts/get-nb-id.sh)

              nbconfig=$(linode_cli nodebalancers configs-list "$nbid" --json)

              config_id=$(echo "$nbconfig" | jq -er '.[] | select(.port == 80) | .id')

              nodes=$(linode_cli nodebalancers nodes-list "$nbid" "$config_id" --json)

              addresses=$(echo "$nodes" | jq -r '.[].address')

              if [[ -z "$addresses" ]]; then
                fail "NodeBalancer has no backend addresses"
              fi

              for address in $addresses; do
                if [[ $address =~ ^\[(.*)\]:([0-9]+)$ ]]; then
                  host="${BASH_REMATCH[1]}"
                else
                  host="${address%:*}"
                fi

                if [[ $host == *:* ]]; then
                  continue
                else
                  fail "NodeBalancer backend address $address is not IPv6"
                fi
              done
            check:
              ($error): ~
    - name: Wait for loadbalancer to start serving traffic
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 15m
            content: |
              bash -ce '
              source ../scripts/lib.sh
              target_ip=$(kubectl get svc svc-test -n "$NAMESPACE" -o json | jq -r '"'"'.status.loadBalancer.ingress[]? | select(.ip != null and (.ip | contains(":") | not)) | .ip'"'"' | head -n1)
              target="http://$target_ip:80"

              wait_for_loadbalancer() {
                  local output
                  output=$(curl --fail --silent --max-time 8 "$target" | jq -er .podName) || output=""
                  [[ "$output" == test-* ]]
              }

              retry 60 5 wait_for_loadbalancer
              '
            check:
              ($error == null): true
    - name: Fetch loadbalancer ip and check both pods reachable
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 10m
            content: |
              bash -ce '
              source ../scripts/lib.sh
              target_ip=$(kubectl get svc svc-test -n "$NAMESPACE" -o json | jq -r '"'"'.status.loadBalancer.ingress[]? | select(.ip != null and (.ip | contains(":") | not)) | .ip'"'"' | head -n1)
              target="http://$target_ip:80"
              podnames=()
              kubectl get pods -n "$NAMESPACE" -l app=lb-ipv6-backends -o wide >&2

              check_pod_batch() {
                  local attempt
                  local response
                  local podname
                  local existing
                  for attempt in {1..10}; do
                      if [[ ${#podnames[@]} -ge 2 ]]; then
                          return 0
                      fi

                      response=$(curl --fail --silent --max-time 8 "$target") || response=""
                      podname=$(printf "%s" "$response" | jq -r .podName 2>/dev/null || true)

                      if [[ "$podname" == *"test-"* ]]; then
                          unique=true
                          for existing in "${podnames[@]}"; do
                              if [[ "$existing" == "$podname" ]]; then
                                  unique=false
                                  break
                              fi
                          done
                          if [[ "$unique" == true ]]; then
                              podnames+=("$podname")
                          fi
                      fi
                  done

                  ((${#podnames[@]} >= 2))
              }

              if ! retry 5 10 check_pod_batch; then
                  fail "Expected responses from two distinct pods, observed ${#podnames[@]}"
              fi
              '
            check:
              ($error == null): true
