# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lb-with-node-addition
  labels:
    all:
spec:
  namespace: "lb-with-node-addition"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -euo pipefail
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "lb-with-node-addition" | tail -100
  steps:
    - name: Create resources
      try:
        - apply:
            file: create-pods-services.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service
    - name: Check that loadbalancer ip is assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-test
            status:
              (loadBalancer.ingress[0].ip != null): true
    - name: Validate nodebalancer has 2 nodes
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 10m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              nbid=$(KUBECONFIG=$KUBECONFIG NAMESPACE=$NAMESPACE LINODE_TOKEN=$LINODE_TOKEN ../scripts/get-nb-id.sh)

              echo "Nodebalancer ID: $nbid"

              node_count_reached=false
              for attempt in {1..20}; do
                  response=$(curl -sf \
                    -H "Authorization: Bearer $LINODE_TOKEN" \
                    -H "Content-Type: application/json" --fail-early --retry 3 \
                    "$LINODE_URL/v4/nodebalancers/$nbid/configs" || true)

                  nbconfig=$(echo "$response" | jq '.data[]? | select(.port == 80)' || true)

                  if [[ -z $nbconfig ]]; then
                      printf 'Failed fetching NodeBalancer config for port 80; retrying\n' >&2
                      if ((attempt < 20)); then
                          sleep 20
                      fi
                      continue
                  fi

                  port_80_up_nodes=$(echo $nbconfig | jq '(.nodes_status.up)|tonumber >= 2')

                  if [[ $port_80_up_nodes == "true" ]]; then
                      node_count_reached=true
                      break
                  fi
                  printf 'NodeBalancer does not have two nodes up yet (up=%s)\n' "$port_80_up_nodes" >&2
                  if ((attempt < 20)); then
                      sleep 20
                  fi
              done
              [[ "$node_count_reached" == true ]] || fail "NodeBalancer did not have two nodes up after 20 attempts"
            check:
              ($error == null): true
    - name: Add new node and check nodebalancer gets updated
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 10m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              current_replicas=$(KUBECONFIG=$MGMT_KUBECONFIG kubectl get machinedeployment ${CLUSTER_NAME} -o=jsonpath='{.spec.replicas}')
              required_replicas=$((current_replicas + 1))
              KUBECONFIG=$MGMT_KUBECONFIG kubectl patch machinedeployment ${CLUSTER_NAME} --type='merge' -p "{\"spec\":{\"replicas\":$required_replicas}}"

              sleep 180

              nbid=$(KUBECONFIG=$KUBECONFIG NAMESPACE=$NAMESPACE LINODE_TOKEN=$LINODE_TOKEN ../scripts/get-nb-id.sh)
              echo "Nodebalancer ID: $nbid"

              node_count_reached=false
              for attempt in {1..30}; do
                  response=$(curl -sf \
                    -H "Authorization: Bearer $LINODE_TOKEN" \
                    -H "Content-Type: application/json" --fail-early --retry 3 \
                    "$LINODE_URL/v4/nodebalancers/$nbid/configs" || true)

                  nbconfig=$(echo "$response" | jq '.data[]? | select(.port == 80)' || true)

                  if [[ -z $nbconfig ]]; then
                      printf 'Failed fetching NodeBalancer config for port 80; retrying\n' >&2
                  else
                      port_80_up_nodes=$(echo $nbconfig | jq '(.nodes_status.up)|tonumber >= 3')

                      if [[ $port_80_up_nodes == "true" ]]; then
                          node_count_reached=true
                          break
                      fi
                      printf 'NodeBalancer does not have three nodes up yet (up=%s)\n' "$port_80_up_nodes" >&2
                  fi
                  if ((attempt < 30)); then
                      sleep 20
                  fi
              done
              [[ "$node_count_reached" == true ]] || fail "NodeBalancer did not have three nodes up after 30 attempts"

              #KUBECONFIG=$MGMT_KUBECONFIG kubectl patch machinedeployment ${CLUSTER_NAME} --type='merge' -p "{\"spec\":{\"replicas\":$current_replicas}}"
            check:
              ($error == null): true
