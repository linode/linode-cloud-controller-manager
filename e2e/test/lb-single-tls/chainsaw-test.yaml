# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lb-single-tls
  labels:
    all:
    lke:
spec:
  namespace: "lb-single-tls"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -euo pipefail
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "lb-single-tls" | tail -100
  steps:
    - name: Create secret
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              kubectl -n "$NAMESPACE" create secret tls tls-secret --cert=../certificates/server.crt --key=../certificates/server.key
            check:
              ($error == null): true
    - name: Check TLS secret exists
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: tls-secret
    - name: Create pods and services
      try:
        - apply:
            file: create-pods-services.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service
    - name: Check that loadbalancer ip is assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-test
            status:
              (loadBalancer.ingress[0].ip != null): true
    - name: Fetch loadbalancer ip and check if pod is reachable
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 4m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh
              IP=$(kubectl get svc svc-test -n "$NAMESPACE" -o json | jq -r .status.loadBalancer.ingress[0].ip)

              pod_reachable() {
                  local output
                  output=$(curl --fail --silent --max-time 10 \
                    --resolve "linode.test:80:$IP" \
                    --cacert ../certificates/ca.crt \
                    https://linode.test:80 | jq -er '.podName') || output=""
                  [[ "$output" == test-* ]]
              }

              if ! retry 10 10 pod_reachable; then
                  fail "No pod responded through the TLS load balancer"
              fi
            check:
              ($error == null): true
