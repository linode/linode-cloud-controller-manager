# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lb-created-with-reserved-ip-nb-range
  labels:
    all:
    lke:
spec:
  namespace: "lb-created-with-reserved-ip-nb-range"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -euo pipefail
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "lb-created-with-reserved-ip-nb-range" | tail -100
  steps:
    - name: Create nodebalancer and create resources
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            outputs:
              - name: ip
                value: (json_parse($stdout))
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              re='^[0-9]+$'
              LABEL="ccm-$(head /dev/urandom | tr -dc 'a-z0-9' | head -c 5)"

              nb_data=$(jq -cn --arg label "$LABEL" --arg region "$LINODE_REGION" '{label: $label, region: $region}')
              nbid=$(create_nodebalancer "$nb_data")
              if ! [[ $nbid =~ $re ]]; then
                fail "NodeBalancer id [$nbid] is incorrect, failed to create NodeBalancer"
              fi

              ip=$(linode_cli nodebalancers view "$nbid" --json | jq -er '.[0].ipv4')
              if ! is_ipv4_address "$ip"; then
                fail "NodeBalancer IPv4 [$ip] is incorrect"
              fi

              if ! linode_cli networking ip-update "$ip" --reserved true --json \
                | jq -e '.[0].reserved == true' >/dev/null; then
                fail "Unable to reserve IP $ip"
              fi
              reserved_ip=$ip
              create_cm=$(kubectl -n $NAMESPACE create configmap reserved-ip-config --from-literal=ReservedIP=$reserved_ip -o yaml --dry-run=client | kubectl apply -f -)
              if [[ "$create_cm" != "configmap/reserved-ip-config created" ]]; then
                fail "Unable to create configmap. Error: $create_cm"
              fi

              tagged_ip=$(linode_cli networking reserved-ip-update "$reserved_ip" --tags "$E2E_RESERVED_IP_TAG" --json)
              if ! jq -e --arg tag "$E2E_RESERVED_IP_TAG" 'any(.[0].tags[]?; . == $tag)' <<< "$tagged_ip" >/dev/null; then
                fail "Unable to tag reserved IP $reserved_ip"
              fi

              linode_cli nodebalancers delete "$nbid" --json >/dev/null

              fw_label="ccm-fwtest-$RANDOM"
              fw_data=$(jq -cn --arg label "$fw_label" --arg ports "80" '{
                label: $label,
                rules: {
                  inbound: [{
                    action: "ACCEPT",
                    label: "inbound-rule123",
                    description: "inbound rule123",
                    ports: $ports,
                    protocol: "TCP",
                    addresses: {ipv4: ["0.0.0.0/0"]}
                  }],
                  inbound_policy: "ACCEPT",
                  outbound_policy: "ACCEPT"
                }
              }')
              fw_id=$(create_firewall "$fw_data")
              if [[ ! $fw_id =~ ^[0-9]+$ ]]; then
                fail "Failed to create firewall: $fw_id"
              fi

              echo "{\"reserved_ip\": \"$reserved_ip\",
                    \"fw_id\": \"$fw_id\"}"

              if ! kubectl -n $NAMESPACE patch configmap reserved-ip-config --type merge -p "{\"data\":{\"FW_ID\":\"$fw_id\"}}" >/dev/null; then
                fail "Unable to update configmap"
              fi
            check:
              ($error == null): true
        - apply:
            file: create-pods-services.yaml 
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service  
      cleanup:
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              cleanup_error=""
              fw_id=$(kubectl get configmap reserved-ip-config -o=jsonpath='{.data.FW_ID}' -n "$NAMESPACE" 2>/dev/null || true)
              if [ -z "$fw_id" ]; then
                  cleanup_error="No firewall id found in configmap"
              fi

              if [[ -n "$fw_id" ]]; then
                if linode_cli firewalls delete "$fw_id" --json >/dev/null 2>&1 \
                  || linode_firewall_absent "$fw_id"; then
                  echo "Firewall $fw_id deleted successfully"
                else
                  cleanup_error="${cleanup_error:+$cleanup_error; }Unable to delete firewall: $fw_id"
                fi
              fi

              # Release the primary reserved IP if it still exists. On the happy
              # path CCM already released it when svc-test was torn down, so this
              # is a best-effort, idempotent no-op; on failure paths it prevents
              # the reserved IP from leaking (chainsaw does not track reserved IPs
              # created via the API).
              primary_ip=$(kubectl get configmap reserved-ip-config -o=jsonpath='{.data.ReservedIP}' -n $NAMESPACE 2>/dev/null || true)
              if [[ "$primary_ip" =~ ^[0-9.]+$ ]]; then
                if ! ../scripts/cleanup-reserved-ips.sh release "$primary_ip"; then
                  cleanup_error="${cleanup_error:+$cleanup_error; }Unable to release reserved IP $primary_ip"
                fi
              fi

              delete_cm=$(kubectl delete configmap reserved-ip-config -n "$NAMESPACE" 2>&1) || true
              if [[ "$delete_cm" == *'configmap "reserved-ip-config" deleted'* ]]; then
                echo "Configmap deleted successfully"
              else
                cleanup_error="${cleanup_error:+$cleanup_error; }Unable to delete the configmap: $delete_cm"
              fi
              if [[ -n "$cleanup_error" ]]; then
                fail "$cleanup_error"
              fi
            check:
              ($error == null): true
    - name: Check that loadbalancer ip is assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-test
            status:
              (loadBalancer.ingress[0].ip != null): true
    - name: get service ip and compare with reserved ip
      try:
        - script: 
            shell: bash
            shellArgs:
              - -c
            timeout: 4m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              reserved_ip=$(kubectl get configmap reserved-ip-config -o=jsonpath='{.data.ReservedIP}' -n $NAMESPACE)
              if [ -z "$reserved_ip" ]; then
                  fail "No reserved ip found in configmap"
              fi

              service_ip=$(kubectl get svc svc-test -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
              if [ -z "$service_ip" ]; then
                  fail "No service ip found for service svc-test"
              fi
              echo "{\"service_ip\": $service_ip}"
              echo "{\"reserved_ip\": $reserved_ip}"
              if [[ "$service_ip" == "$reserved_ip" ]]; then
                echo "IPs Match"
              else
                fail "IPs do not match: service=$service_ip reserved=$reserved_ip"
              fi

              #Run a curl command to the service ip
              URL="http://$service_ip:80/"
              check_service_response() {
                HTTP_RESPONSE=$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" "$URL" || true)
                [[ "$HTTP_RESPONSE" == "200" ]]
              }
              if ! retry 10 10 check_service_response; then
                fail "Request did not return HTTP 200 from the service after 10 attempts"
              fi
            check:
              ($error == null): true
      
