# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lb-created-with-reserved-ip-change-ip-unreserved
  labels:
    all:
    lke:
spec:
  namespace: "lb-created-with-reserved-ip-change-ip-unreserved"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -euo pipefail
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "lb-created-with-reserved-ip-change-ip-unreserved" | tail -100
  steps:
    - name: create reserved ip and nodebalancer resources
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh
              #!/bin/bash

              re='^((25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})$'

              reserved_ip=$(curl -s --request POST \
                -H "Authorization: Bearer $LINODE_TOKEN" \
                -H "Content-Type: application/json" --fail-early --retry 3 \
                -H "accept: application/json" \
                "${LINODE_URL}/v4beta/networking/reserved/ips" \
                --data "{\"region\": \"$LINODE_REGION\", \"tags\": [\"$E2E_RESERVED_IP_TAG\"]}" | jq .address)

              reserved_ip=$(echo "$reserved_ip" | tr -d '"')
              
              if ! [[ $reserved_ip =~ $re ]]; then
                  fail "Reserved ip [$reserved_ip] is incorrect, failed to create a reserved ip"
              fi
              
              create_cm=$(kubectl -n $NAMESPACE create configmap reserved-ip-config --from-literal=ReservedIP=$reserved_ip --from-literal=UnreservedIP="100.10.10.10" -o yaml --dry-run=client | kubectl apply -f -)
              if [[ "$create_cm" != "configmap/reserved-ip-config created" ]]; then
                fail "Unable to create configmap. Error: $create_cm"
              fi

              echo "{ \"reserved_ip\": \"$reserved_ip\" ,
                \"unreserved_ip\": \"100.10.10.10\"}"
            check:
              ($error == null): true
            outputs:
              - name: ip
                value: (json_parse($stdout))
        - apply:
            file: create-pods-services.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service
      cleanup:
        - script: 
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              cleanup_error=""

              # Release the primary reserved IP if it still exists. On the happy
              # path CCM already released it when svc-test was torn down, so this
              # is a best-effort, idempotent no-op; on failure paths it prevents
              # the reserved IP from leaking (chainsaw does not track reserved IPs
              # created via the API). The UnreservedIP value is not a real
              # reservation, so it is intentionally left alone.
              primary_ip=$(kubectl get configmap reserved-ip-config -o=jsonpath='{.data.ReservedIP}' -n $NAMESPACE 2>/dev/null || true)
              if ! [[ "$primary_ip" =~ ^[0-9.]+$ ]]; then
                cleanup_error="No reserved ip found in configmap"
              elif ! ../scripts/cleanup-reserved-ips.sh release "$primary_ip"; then
                cleanup_error="${cleanup_error:+$cleanup_error; }Unable to release reserved IP $primary_ip"
              fi

              delete_cm=$(kubectl delete configmap reserved-ip-config -n $NAMESPACE 2>&1) || true
              if [[ "$delete_cm" == *'configmap "reserved-ip-config" deleted'* ]]; then
                echo "Configmap deleted successfully"
              else
                cleanup_error="${cleanup_error:+$cleanup_error; }Unable to delete the configmap: $delete_cm"
              fi
              if [[ -n "$cleanup_error" ]]; then
                fail "$cleanup_error"
              fi
            check:
              ($error == null): true
    - name: Check that loadbalancer ip is assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-test
            status:
              (loadBalancer.ingress[0].ip != null): true
    - name: Change annotation and check for warning event
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh
              #!/bin/bash

              reserved_ip=$(kubectl get configmap reserved-ip-config -o=jsonpath='{.data.ReservedIP}' -n $NAMESPACE)
              if [ -z "$reserved_ip" ]; then
                  fail "No reserved ip found in configmap"
              fi

              unreserved_ip=$(kubectl get configmap reserved-ip-config -o=jsonpath='{.data.UnreservedIP}' -n $NAMESPACE)
              if [ -z "$unreserved_ip" ]; then
                  fail "No unreserved ip found in configmap"
              fi
              
              patch=$(kubectl patch service svc-test -n $NAMESPACE --patch "{
                \"metadata\": {
                  \"annotations\": {
                    \"service.beta.kubernetes.io/linode-loadbalancer-reserved-ipv4\": \"$unreserved_ip\"
                  }
                }
              }")

              if [[ "$patch" != "service/svc-test patched" ]]; then
                fail "Unable to update annotation"
              fi

              warning_found=false
              for _ in {1..10}; do
                events=$(kubectl get events -n $NAMESPACE --field-selector reason=NodeBalancerIPChangeIgnored --sort-by='.lastTimestamp' -o json)
                message=$(echo $events | jq .items[0].message)

                if [[ "$message" =~ ^\"IPv4\ annotation\ changed\ to\ $unreserved_ip,\ but\ NodeBalancer\ \([0-9]+\)\ IP\ cannot\ be\ updated\ after\ creation.\ It\ will\ remain\ $reserved_ip\"$ ]]; then
                  echo "Warning event found"
                  warning_found=true
                  break
                fi
                sleep 10
              done
              if [[ "$warning_found" != true ]]; then
                fail "Warning event not found after 10 attempts for annotation change to $unreserved_ip"
              fi
            check:
              ($error == null): true
    - name: get service ip and compare with reserved ip
      try:
        - script: 
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              reserved_ip=$(kubectl get configmap reserved-ip-config -o=jsonpath='{.data.ReservedIP}' -n $NAMESPACE)
              if [ -z "$reserved_ip" ]; then
                  fail "No reserved ip found in configmap"
              fi
              
              service_ip=$(kubectl get svc svc-test -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
              if [ -z "$service_ip" ]; then
                  fail "No service ip found for service svc-test"
              fi
              echo "{\"service_ip\": $service_ip}"
              echo "{\"reserved_ip\": $reserved_ip}"
              if [[ "$service_ip" == "$reserved_ip" ]]; then
                echo "IPs Match"
              else
                fail "IPs do not match: service=$service_ip reserved=$reserved_ip"
              fi
            check:
              ($error == null): true
              
