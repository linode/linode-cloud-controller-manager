# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lb-created-with-invalid-ip
  labels:
    all:
    lke:
spec:
  namespace: "lb-created-with-invalid-ip"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -euo pipefail
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "lb-created-with-invalid-ip" | tail -100
  steps:
    - name: create reserved ip and nodebalancer resources
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              invalid_ip="100.1000.1000.1000"

              create_cm=$(kubectl -n $NAMESPACE create configmap invalid-ip-config --from-literal=InvalidIP=$invalid_ip -o yaml --dry-run=client | kubectl apply -f -)
              if [[ "$create_cm" != "configmap/invalid-ip-config created" ]]; then
                fail "Unable to create configmap. Error: $create_cm"
              fi

              echo "{\"invalid_ip\": \"$invalid_ip\"}"
            check:
              ($error == null): true
            outputs:
              - name: ip
                value: (json_parse($stdout))
        - apply:
            file: create-pods-services.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service
      cleanup:
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              delete_cm=$(kubectl delete configmap invalid-ip-config -n $NAMESPACE)
              if [[ "$delete_cm" == *'configmap "invalid-ip-config" deleted'* ]]; then
                echo "Configmap deleted successfully"
              else
                fail "Unable to delete the configmap: $delete_cm"
              fi
            check:
              ($error == null): true
    - name: Check that loadbalancer ip is not assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-test
            status:
              (loadBalancer.ingress[0].ip == null): true
    - name: assert invalid IP warning event
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Event
              type: Warning
              reason: SyncLoadBalancerFailed
              "(contains(message, 'Error syncing load balancer: failed to ensure load balancer: [400] Invalid IPv4 address') && contains(message, $ip.invalid_ip))": true
    - name: get service ip and compare with invalid ip
      try:
        - script: 
            shell: bash
            shellArgs:
              - -c
            timeout: 3m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh
              invalid_ip=$(kubectl get configmap invalid-ip-config -o=jsonpath='{.data.InvalidIP}' -n $NAMESPACE)
              if [[ -z "$invalid_ip" ]]; then
                  fail "No invalid ip found in configmap"
              fi

              service_ip=$(kubectl get svc svc-test -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
              if [[ "$service_ip" != "" ]]; then
                  fail "Service ip found for service svc-test: expected empty, got $service_ip"
              fi
              if [[ "$service_ip" == "$invalid_ip" ]]; then
                fail "Expected service ip to be null, got the invalid ip: $invalid_ip"
              fi
              echo "{\"service_ip\": $service_ip}"
              echo "{\"invalid_ip\": $invalid_ip}"
            check:
              ($error == null): true
              
