# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lb-fw-update-acl
  labels:
    all:
    lke:
spec:
  namespace: "lb-fw-update-acl"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -euo pipefail
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "lb-fw-update-acl" | tail -100
  steps:
    - name: Create pods and services
      try:
        - apply:
            file: create-pods-services.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service
    - name: Check that loadbalancer ip is assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-test
            status:
              (loadBalancer.ingress[0].ip != null): true
    - name: Fetch Nodebalancer ID, make sure it has firewall attached
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 3m
            content: |
              set -euo pipefail

              source ../scripts/lib.sh
              nbid=$(KUBECONFIG=$KUBECONFIG NAMESPACE=$NAMESPACE LINODE_TOKEN=$LINODE_TOKEN ../scripts/get-nb-id.sh)
              if ! retry_jq 10 10 'select(length == 1 and any(.[0].rules.inbound[]?.addresses.ipv4[]?; . == "7.7.7.7/32"))' linode_firewalls_for_nodebalancer "$nbid" >/dev/null; then
                  fail "Firewall was not attached with the expected 7.7.7.7/32 rule after 10 attempts"
              fi
            check:
                ($error == null): true
    - name: Update service with new ACL
      try:
        - apply:
            file: update-service.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Service
    - name: Fetch firewall ID and check rules are updated
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 3m
            content: |
              set -euo pipefail

              source ../scripts/lib.sh
              nbid=$(KUBECONFIG=$KUBECONFIG NAMESPACE=$NAMESPACE LINODE_TOKEN=$LINODE_TOKEN ../scripts/get-nb-id.sh)
              if ! retry_jq 10 10 'select(length == 1) | .[0] as $firewall | [$firewall.rules.inbound[]?.addresses.ipv4[]?] as $ips | select(($ips | length) > 0 and all($ips[]; . != "7.7.7.7/32"))' linode_firewalls_for_nodebalancer "$nbid" >/dev/null; then
                  fail "Firewall rule did not update away from 7.7.7.7/32 after 10 attempts"
              fi
            check:
                ($error == null): true
