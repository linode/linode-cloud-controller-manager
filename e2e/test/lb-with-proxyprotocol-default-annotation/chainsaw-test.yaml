# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lb-with-proxyprotocol-default-annotation
  labels:
    all:
    lke:
spec:
  namespace: "lb-with-proxyprotocol-default-annotation"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -euo pipefail
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "lb-with-proxyprotocol-default-annotation" | tail -100
  steps:
    - name: Create pods and services
      try:
        - apply:
            file: create-pods-services.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service
    - name: Check endpoints exist
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Endpoints
            metadata:
              name: svc-test
            (subsets[0].addresses != null): true
            (subsets[0].ports != null): true
    - name: Check that loadbalancer ip is assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-test
            status:
              (loadBalancer.ingress[0].ip != null): true
    - name: Add ProxyProtocol v2 using deprecated annotation
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              kubectl annotate svc svc-test -n $NAMESPACE service.beta.kubernetes.io/linode-loadbalancer-proxy-protocol=v2
            check:
              ($error == null): true
    - name: Check NodeBalancerConfig for port 80 and 8080 have ProxyProtocol v2
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 3m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              nbid=$(KUBECONFIG=$KUBECONFIG NAMESPACE=$NAMESPACE LINODE_TOKEN=$LINODE_TOKEN ../scripts/get-nb-id.sh)

              if ! retry_jq 10 10 'select(any(.[]; .port == 80 and .proxy_protocol == "v2") and any(.[]; .port == 8080 and .proxy_protocol == "v2"))' \
                linode_cli nodebalancers configs-list "$nbid" --json >/dev/null; then
                fail "Expected ProxyProtocol v2 on ports 80 and 8080 after 10 attempts"
              fi
            check:
              ($error): ~
    - name: Add default annotation for ProxyProtocol v1
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              kubectl annotate svc svc-test -n $NAMESPACE service.beta.kubernetes.io/linode-loadbalancer-default-proxy-protocol=v1
            check:
              ($error == null): true
    - name: Check NodeBalancerConfig for port 80 and 8080 have ProxyProtocol v1
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 3m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              nbid=$(KUBECONFIG=$KUBECONFIG NAMESPACE=$NAMESPACE LINODE_TOKEN=$LINODE_TOKEN ../scripts/get-nb-id.sh)

              if ! retry_jq 10 10 'select(any(.[]; .port == 80 and .proxy_protocol == "v1") and any(.[]; .port == 8080 and .proxy_protocol == "v1"))' \
                linode_cli nodebalancers configs-list "$nbid" --json >/dev/null; then
                fail "Expected ProxyProtocol v1 on ports 80 and 8080 after 10 attempts"
              fi
            check:
              ($error): ~
