# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lb-update-port
  labels:
    all:
    lke:
spec:
  namespace: "lb-update-port"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -euo pipefail
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "lb-update-port" | tail -100
  steps:
    - name: Create pods and services
      try:
        - apply:
            file: create-pods-services.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service
    - name: Check that loadbalancer ip is assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-test
            status:
              (loadBalancer.ingress[0].ip != null): true
    - name: Fetch loadbalancer ip and check both pods reachable
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh
              IP=$(kubectl get svc svc-test -n "$NAMESPACE" -o json | jq -r .status.loadBalancer.ingress[0].ip)

              podnames=()

              for attempt in {1..20}; do
                  if [[ ${#podnames[@]} -ge 2 ]]; then
                      break
                  fi

                  output=$(curl -fsS --max-time 10 "$IP:80" | jq -er '.podName') || output=""
                  if [[ "$output" == test-* ]]; then
                      unique=true
                      for existing in "${podnames[@]}"; do
                          if [[ "$existing" == "$output" ]]; then
                              unique=false
                              break
                          fi
                      done
                      if [[ "$unique" == true ]]; then
                          podnames+=("$output")
                      fi
                  fi

                  if ((attempt < 20)); then
                      sleep 10
                  fi
              done

              if [[ ${#podnames[@]} -lt 2 ]]; then
                  fail "Expected responses from two distinct pods on port 80, observed ${#podnames[@]}"
              fi
            check:
              ($error == null): true
    - name: Update service
      try:
        - apply:
            file: update-port-service.yaml
    - name: Check pods reachable on new port
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh
              #wait for changes to propagate to the LB
              IP=$(kubectl get svc svc-test -n "$NAMESPACE" -o json | jq -r .status.loadBalancer.ingress[0].ip)

              podnames=()

              for attempt in {1..30}; do
                  if [[ ${#podnames[@]} -ge 2 ]]; then
                      break
                  fi

                  output=$(curl -fsS --max-time 10 "$IP:8080" | jq -er '.podName') || output=""
                  if [[ "$output" == test-* ]]; then
                      unique=true
                      for existing in "${podnames[@]}"; do
                          if [[ "$existing" == "$output" ]]; then
                              unique=false
                              break
                          fi
                      done
                      if [[ "$unique" == true ]]; then
                          podnames+=("$output")
                      fi
                  fi

                  if ((attempt < 30)); then
                      sleep 10
                  fi
              done

              if [[ ${#podnames[@]} -lt 2 ]]; then
                  fail "Expected responses from two distinct pods on port 8080, observed ${#podnames[@]}"
              fi
            check:
              ($error == null): true
    - name: Fetch firewall ID and check ports are updated
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh
              firewall_rule_updated=false
              for attempt in {1..10}; do
                  nbid=$(KUBECONFIG=$KUBECONFIG NAMESPACE=$NAMESPACE LINODE_TOKEN=$LINODE_TOKEN ../scripts/get-nb-id.sh)

                  fw=$(curl -s --request GET \
                    -H "Authorization: Bearer $LINODE_TOKEN" \
                    -H "Content-Type: application/json" --fail-early --retry 3 \
                    -H "accept: application/json" \
                    "$LINODE_URL/v4/nodebalancers/${nbid}/firewalls" || true)
                  echo "$fw" | jq -r '.data[].rules.inbound[]'
                  if echo "$fw" | jq -r '.data[].rules.inbound[].ports' | grep 8080 ; then
                    firewall_rule_updated=true
                    break
                  fi
                  if ((attempt < 10)); then
                    sleep 10
                  fi
              done
              [[ "$firewall_rule_updated" == true ]] || fail "Firewall rule was not updated with port 8080"
            check:
                ($error == null): true
