# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lb-update-port
  labels:
    all:
    lke:
spec:
  namespace: "lb-update-port"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -euo pipefail
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "lb-update-port" | tail -100
  steps:
    - name: Create pods and services
      try:
        - apply:
            file: create-pods-services.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service
    - name: Check that loadbalancer ip is assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-test
            status:
              (loadBalancer.ingress[0].ip != null): true
    - name: Fetch loadbalancer ip and check both pods reachable
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 8m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh
              IP=$(kubectl get svc svc-test -n "$NAMESPACE" -o json | jq -r .status.loadBalancer.ingress[0].ip)

              podnames=()

              if ! retry 20 10 observe_distinct_pods "$IP:80"; then
                  fail "Expected responses from two distinct pods on port 80, observed ${#podnames[@]}"
              fi
            check:
              ($error == null): true
    - name: Update service
      try:
        - apply:
            file: update-port-service.yaml
    - name: Check pods reachable on new port
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 12m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh
              #wait for changes to propagate to the LB
              IP=$(kubectl get svc svc-test -n "$NAMESPACE" -o json | jq -r .status.loadBalancer.ingress[0].ip)

              podnames=()

              if ! retry 30 10 observe_distinct_pods "$IP:8080"; then
                  fail "Expected responses from two distinct pods on port 8080, observed ${#podnames[@]}"
              fi
            check:
              ($error == null): true
    - name: Fetch firewall ID and check ports are updated
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 3m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh
              nbid=$(KUBECONFIG=$KUBECONFIG NAMESPACE=$NAMESPACE LINODE_TOKEN=$LINODE_TOKEN ../scripts/get-nb-id.sh)
              if ! retry_jq 10 10 'select(any(.[]; any(.rules.inbound[]?; (.ports // "" | tostring | contains("8080")))))' \
                linode_firewalls_for_nodebalancer "$nbid" >/dev/null; then
                fail "Firewall rule was not updated with port 8080 after 10 attempts"
              fi
            check:
                ($error == null): true
