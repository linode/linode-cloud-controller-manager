# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lb-updated-with-nb-id
  labels:
    all:
    lke:
spec:
  namespace: "lb-updated-with-nb-id"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -uo pipefail
          source ../scripts/lib.sh
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "lb-updated-with-nb-id" | tail -100 || true

          # This test creates a NodeBalancer directly via the Linode API, which
          # chainsaw does not track and will not auto-delete. Its id is recorded in
          # the nb-cleanup ConfigMap as it is created. If a step fails before the
          # NodeBalancer is adopted by the Service (so CCM would clean it up),
          # delete it here so it does not leak (best-effort, idempotent).
          echo "Cleaning up NodeBalancers created via the API (if any)..."
          nbids=""
          if kubectl get configmap nb-cleanup -n "$NAMESPACE" >/dev/null 2>&1; then
            nbids="$(kubectl get configmap nb-cleanup -n "$NAMESPACE" -o jsonpath='{.data.nb1} {.data.nb2}' 2>/dev/null || true)"
          fi
          for nbid in $nbids; do
            if [[ "$nbid" =~ ^[0-9]+$ ]]; then
              echo "Deleting NodeBalancer $nbid"
              linode_cli nodebalancers delete "$nbid" --json >/dev/null || echo "WARNING: failed to delete NodeBalancer $nbid; it may have leaked" >&2
            fi
          done
  steps:
    - name: Create pods and services
      try:
        - apply:
            file: create-pods-services.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service
    - name: Check that loadbalancer ip is assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-test
            status:
              (loadBalancer.ingress[0].ip != null): true
    - name: Create nodebalancer, annotate svc with nodebalancer id and validate
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 10m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              re='^[0-9]+$'
              LABEL="ccm-$(head /dev/urandom | tr -dc 'a-z0-9' | head -c 5)"

              # Get data to use for new nodebalancer
              data=$(KUBECONFIG=$KUBECONFIG NAMESPACE=$NAMESPACE LINODE_TOKEN=$LINODE_TOKEN LABEL=$LABEL REGION=$REGION ../scripts/get-nb-create-data.sh svc-test)

              nbid=$(create_nodebalancer "$data")

              if ! [[ $nbid =~ $re ]]; then
                  fail "Nodebalancer id [$nbid] for label [$LABEL] is incorrect, failed to create nodebalancer"
              else
                  # Record the NodeBalancer id so the test-level catch can delete it
                  # if a later step fails before the Service adopts it (chainsaw does
                  # not track NodeBalancers created via the API).
                  kubectl create configmap nb-cleanup -n "$NAMESPACE" --from-literal=nb1="$nbid" --dry-run=client -o yaml | kubectl apply -f - >/dev/null 2>&1 || true

                  kubectl annotate svc svc-test -n $NAMESPACE service.beta.kubernetes.io/linode-loadbalancer-nodebalancer-id=$nbid
                  check_new_nodebalancer_adopted() {
                      local current_nbid
                      current_nbid=$(KUBECONFIG=$KUBECONFIG NAMESPACE=$NAMESPACE LINODE_TOKEN=$LINODE_TOKEN ../scripts/get-nb-id.sh) || return 1
                      [[ "$current_nbid" == "$nbid" ]]
                  }
                  if ! retry 20 20 check_new_nodebalancer_adopted; then
                      fail "Service did not adopt new NodeBalancer $nbid after 20 attempts"
                  fi
              fi
            check:
              ($error == null): true
