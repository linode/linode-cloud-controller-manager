# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: route-controller-test
  labels:
    all:
spec:
  bindings:
    - name: fwname
      value: (join('-', ['ccm-fwtest', env('CLUSTER_NAME')]))
  namespace: "route-controller-test"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -euo pipefail
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "route-controller-test" | tail -100
  steps:
    - name: Check if the route controller updated the config for the linode
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              if [ -z "$KUBECONFIG" ] || [ -z "$LINODE_TOKEN" ]; then
                  fail "KUBECONFIG and LINODE_TOKEN environment variables must be set"
              fi

              # Get all node names
              nodes=$(kubectl get nodes -o jsonpath='{.items[*].metadata.name}')
              if [ -z "$nodes" ]; then
                  fail "No nodes found in cluster"
              fi

              # Process each node
              for node in $nodes; do
                  echo "Checking node: $node"
                  
                  # Get pod CIDR and instance ID
                  pod_cidr=$(kubectl get node "$node" -o jsonpath='{.spec.podCIDR}')
                  instance_id=$(kubectl get node "$node" -o jsonpath='{.spec.providerID}' | sed 's/linode:\/\///')
                  
                  echo "  Pod CIDR: $pod_cidr"
                  echo "  Instance ID: $instance_id"
                  
                  # Get interface details for this config
                  interfaces=$(linode_cli linodes configs-list "$instance_id" --json | jq -ce '.[0].interfaces')
                  
                  # Check if pod CIDR is in the VPC interface IP ranges
                  if echo "$interfaces" | jq -e --arg cidr "$pod_cidr" '.[] | select(.purpose == "vpc") | .ip_ranges[] | select(. == $cidr)' > /dev/null; then
                      echo "Pod CIDR found in VPC interface configuration"
                  else
                      echo "Pod CIDR not found in VPC interface configuration"
                      echo "Current VPC interface configuration:"
                      echo "$interfaces" | jq '.[] | select(.purpose == "vpc")'
                      fail "Pod CIDR $pod_cidr is missing from node $node VPC interface configuration"
                  fi
                  
                  echo "---"
              done

            check:
              ($error == null): true
    - name: Modify instance label using linodeAPI and check if it still has the route configured
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 4m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              # Use last node to change its label
              node=$(kubectl get nodes -o jsonpath='{.items[-1].metadata.name}')  
              if [ -z "$node" ]; then
                  fail "No nodes found in cluster"
              fi

              instance_id=$(kubectl get node "$node" -o jsonpath='{.spec.providerID}' | sed 's/linode:\/\///')
              pod_cidr=$(kubectl get node "$node" -o jsonpath='{.spec.podCIDR}')
              newNodeName=${node}-test

              # Change label of linode
              if ! linode_cli linodes update "$instance_id" --label "$newNodeName" --json >/dev/null; then
                  fail "Failed updating node label to $newNodeName"
              fi

              currentLabel=""
              check_new_label() {
                  currentLabel=$(linode_cli linodes view "$instance_id" --json | jq -er '.[0].label') || return 1
                  [[ "$currentLabel" == "$newNodeName" ]]
              }
              label_matches=false
              if retry 10 5 check_new_label; then
                  echo "Labels match"
                  label_matches=true
              else
                  echo "Expected Linode label $newNodeName, found $currentLabel"
              fi

              # give the route controller time to reconcile after the rename
              sleep 60

              check_pod_cidr_in_vpc() {
                  local interfaces
                  interfaces=$(linode_cli linodes configs-list "$instance_id" --json | jq -ce '.[0].interfaces') || return 1
                  jq -e --arg cidr "$pod_cidr" \
                    'any(.[]; .purpose == "vpc" and any(.ip_ranges[]?; . == $cidr))' \
                    <<< "$interfaces" >/dev/null
              }
              route_preserved=false
              if retry 12 5 check_pod_cidr_in_vpc; then
                  route_preserved=true
              else
                  echo "Pod CIDR $pod_cidr was not present in the VPC interface configuration after the label update"
              fi

              # revert label to original value
              if ! linode_cli linodes update "$instance_id" --label "$node" --json >/dev/null; then
                  fail "Failed restoring Linode label $node"
              fi
              if [[ "$label_matches" != true ]]; then
                  fail "Expected Linode label $newNodeName, found $currentLabel"
              fi
              if [[ "$route_preserved" != true ]]; then
                  fail "Pod CIDR $pod_cidr is missing from node $node VPC interface configuration after label update"
              fi
            check:
              ($error == null): true
