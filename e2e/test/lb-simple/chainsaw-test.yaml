# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lb-simple
  labels:
    all:
    lke:
spec:
  namespace: "lb-simple"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -euo pipefail
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "lb-simple" | tail -100
  steps:
    - name: Create pods and services
      try:
        - apply:
            file: create-pods-services.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service
    - name: Check that loadbalancer ip is assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-test
            status:
              (loadBalancer.ingress[0].ip != null): true
    - name: Fetch loadbalancer ip and check both pods reachable
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh
              IP=$(kubectl get svc svc-test -n "$NAMESPACE" -o json | jq -r .status.loadBalancer.ingress[0].ip)

              podnames=()

              for attempt in {1..10}; do
                  if [[ ${#podnames[@]} -ge 2 ]]; then
                      break
                  fi

                  output=$(curl -fsS --max-time 10 "$IP:80" | jq -er '.podName') || output=""
                  if [[ "$output" == test-* ]]; then
                      unique=true
                      for existing in "${podnames[@]}"; do
                          if [[ "$existing" == "$output" ]]; then
                              unique=false
                              break
                          fi
                      done
                      if [[ "$unique" == true ]]; then
                          podnames+=("$output")
                      fi
                  fi

                  if ((attempt < 10)); then
                      sleep 10
                  fi
              done

              if [[ ${#podnames[@]} -lt 2 ]]; then
                  fail "Expected responses from two distinct pods, observed ${#podnames[@]}"
              fi
            check:
              ($error == null): true
