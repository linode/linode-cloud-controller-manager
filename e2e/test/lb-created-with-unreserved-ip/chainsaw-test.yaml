# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lb-created-with-unreserved-ip
  labels:
    # all: # Excluded from all until this stops flaking
    lke:
spec:
  namespace: "lb-created-with-unreserved-ip"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -euo pipefail
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "lb-created-with-unreserved-ip" | tail -100
  steps:
    - name: create reserved ip and nodebalancer resources
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              unreserved_ip="100.10.10.10"

              create_cm=$(kubectl -n $NAMESPACE create configmap unreserved-ip-config --from-literal=UnReservedIP=$unreserved_ip -o yaml --dry-run=client | kubectl apply -f -)
              if [[ "$create_cm" != "configmap/unreserved-ip-config created" ]]; then
                fail "Unable to create configmap. Error: $create_cm"
              fi

              echo "{\"unreserved_ip\": \"$unreserved_ip\"}"
            check:
              ($error == null): true
            outputs:
              - name: ip
                value: (json_parse($stdout))
        - apply:
            file: create-pods-services.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service
      cleanup: 
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              delete_cm=$(kubectl delete configmap unreserved-ip-config -n $NAMESPACE)
              if [[ "$delete_cm" == *'configmap "unreserved-ip-config" deleted'* ]]; then
                echo "Configmap deleted successfully"
              else
                fail "Unable to delete the configmap: $delete_cm"
              fi
            check:
              ($error == null): true
    - name: Check that loadbalancer ip is not assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-test
            status:
              (loadBalancer.ingress[0].ip == null): true
    - name: assert unreserved IP warning event
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Event
              type: Warning
              reason: SyncLoadBalancerFailed
              message: "Error syncing load balancer: failed to ensure load balancer: [400] IPv4 address is not reserved"
    - name: get service ip and compare with unreserved ip
      try:
        - script: 
            shell: bash
            shellArgs:
              - -c
            timeout: 3m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              unreserved_ip=$(kubectl get configmap unreserved-ip-config -o=jsonpath='{.data.UnReservedIP}' -n $NAMESPACE)
              if [[ -z "$unreserved_ip" ]]; then
                  fail "No un reserved ip found in configmap"
              fi

              service_ip=$(kubectl get svc svc-test -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
              if [[ "$service_ip" != "" ]]; then
                  fail "Service ip found for service svc-test: expected empty, got $service_ip"
              fi
              echo "{\"service_ip\": $service_ip}"
              echo "{\"unreserved_ip\": $unreserved_ip}"
              if [[ "$service_ip" == "$unreserved_ip" ]]; then
                fail "Expected service ip to be null, got the unreserved ip: $unreserved_ip"
              fi
            check:
              ($error == null): true
