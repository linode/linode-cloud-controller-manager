---
apiVersion: v1
kind: Service
metadata:
  name: svc-test-reserved
  annotations:
    service.beta.kubernetes.io/linode-loadbalancer-backend-ipv4-range: ($reservedRange)
  labels:
    app: with-reserved-backend-ipv4-range
spec:
  type: LoadBalancer
  selector:
    app: with-reserved-backend-ipv4-range
  ports:
    - name: http-1
      protocol: TCP
      port: 80
      targetPort: 8080
  sessionAffinity: None
