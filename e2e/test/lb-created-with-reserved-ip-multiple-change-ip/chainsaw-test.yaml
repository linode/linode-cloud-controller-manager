# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lb-created-with-reserved-ip-multiple-change-ip
  labels:
    all:
    lke:
spec:
  namespace: "lb-created-with-reserved-ip-multiple-change-ip"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -euo pipefail
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "lb-created-with-reserved-ip-multiple-change-ip" | tail -100
  steps:
    - name: create reserved ip and nodebalancer resources
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh
              #!/bin/bash

              reserved_ip=$(create_reserved_ip)

              create_cm=$(kubectl -n $NAMESPACE create configmap reserved-ip-config --from-literal=ReservedIP=$reserved_ip -o yaml --dry-run=client | kubectl apply -f -)
              if [[ "$create_cm" != "configmap/reserved-ip-config created" ]]; then
                fail "Unable to create configmap. Error: $create_cm"
              fi

              reserved_ip2=$(create_reserved_ip)
              
              if ! kubectl -n $NAMESPACE patch configmap reserved-ip-config --type merge -p "{\"data\":{\"ReservedIP2\":\"$reserved_ip2\"}}" >/dev/null; then
                fail "Unable to update configmap"
              fi

              echo "{ \"reserved_ip\": \"$reserved_ip\" ,
                \"reserved_ip2\": \"$reserved_ip2\"}"
            check:
              ($error == null): true
            outputs:
              - name: ip
                value: (json_parse($stdout))
        - apply:
            file: create-pods-services.yaml
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
        - describe:
            apiVersion: v1
            kind: Service
      cleanup:
        - script:
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              cleanup_error=""

              primary_ip=$(kubectl get configmap reserved-ip-config -o=jsonpath='{.data.ReservedIP}' -n $NAMESPACE 2>/dev/null || true)
              if ! [[ "$primary_ip" =~ ^[0-9.]+$ ]]; then
                cleanup_error="No reserved ip found in configmap"
              elif ! ../scripts/cleanup-reserved-ips.sh release "$primary_ip"; then
                cleanup_error="${cleanup_error:+$cleanup_error; }Unable to release reserved IP $primary_ip"
              fi

              reserved_ip2=$(kubectl get configmap reserved-ip-config -o=jsonpath='{.data.ReservedIP2}' -n $NAMESPACE 2>/dev/null || true)
              if ! [[ "$reserved_ip2" =~ ^[0-9.]+$ ]]; then
                cleanup_error="${cleanup_error:+$cleanup_error; }Second reserved ip not found in configmap"
              elif ! ../scripts/cleanup-reserved-ips.sh release "$reserved_ip2"; then
                cleanup_error="${cleanup_error:+$cleanup_error; }Unable to release reserved IP $reserved_ip2"
              fi

              delete_cm=$(kubectl delete configmap reserved-ip-config -n $NAMESPACE 2>&1) || true
              if [[ "$delete_cm" == *'configmap "reserved-ip-config" deleted'* ]]; then
                echo "Configmap deleted successfully"
              else
                cleanup_error="${cleanup_error:+$cleanup_error; }Unable to delete the configmap: $delete_cm"
              fi
              if [[ -n "$cleanup_error" ]]; then
                fail "$cleanup_error"
              fi
            check:
              ($error == null): true
    - name: Check that loadbalancer ip is assigned
      try:
      - assert:
          resource:
            apiVersion: v1
            kind: Service
            metadata:
              name: svc-test
            status:
              (loadBalancer.ingress[0].ip != null): true
    - name: Change annotation and check for warning event
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 4m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh
              #!/bin/bash

              reserved_ip=$(kubectl get configmap reserved-ip-config -o=jsonpath='{.data.ReservedIP}' -n $NAMESPACE)
              if [ -z "$reserved_ip" ]; then
                  fail "No reserved ip found in configmap"
              fi

              reserved_ip2=$(kubectl get configmap reserved-ip-config -o=jsonpath='{.data.ReservedIP2}' -n $NAMESPACE)
              if [ -z "$reserved_ip2" ]; then
                  fail "Second reserved ip not found in configmap"
              fi
              
              patch=$(kubectl patch service svc-test -n $NAMESPACE --patch "{
                \"metadata\": {
                  \"annotations\": {
                    \"service.beta.kubernetes.io/linode-loadbalancer-reserved-ipv4\": \"$reserved_ip2\"
                  }
                }
              }")

              if [[ "$patch" != "service/svc-test patched" ]]; then
                fail "Unable to update annotation: $patch"
              fi

              echo "{\"reserved_ip\": \"$reserved_ip\", \"reserved_ip2\": \"$reserved_ip2\"}"
            check:
              ($error == null): true
            outputs:
              - name: ip
                value: (json_parse($stdout))
        - assert:
            resource:
              apiVersion: v1
              kind: Event
              type: Warning
              reason: NodeBalancerIPChangeIgnored
              involvedObject:
                kind: Service
                name: svc-test
              "(contains(message, $ip.reserved_ip2) && contains(message, $ip.reserved_ip))": true
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 4m
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              patch2=$(kubectl patch service svc-test -n $NAMESPACE --patch "{
                \"metadata\": {
                  \"annotations\": {
                    \"service.beta.kubernetes.io/linode-loadbalancer-reserved-ipv4\": \"100.10.10.10\"
                  }
                }
              }")

              if [[ "$patch2" != "service/svc-test patched" ]]; then
                fail "Unable to update annotation: $patch2"
              fi
            check:
              ($error == null): true
        - assert:
            resource:
              apiVersion: v1
              kind: Event
              type: Warning
              reason: NodeBalancerIPChangeIgnored
              involvedObject:
                kind: Service
                name: svc-test
              "(contains(message, '100.10.10.10') && contains(message, $ip.reserved_ip))": true
    - name: get service ip and compare with reserved ip
      try:
        - script: 
            shell: bash
            shellArgs:
              - -c
            content: |
              set -euo pipefail
              source ../scripts/lib.sh

              reserved_ip=$(kubectl get configmap reserved-ip-config -o=jsonpath='{.data.ReservedIP}' -n $NAMESPACE)
              if [ -z "$reserved_ip" ]; then
                  fail "No reserved ip found in configmap"
              fi

              reserved_ip2=$(kubectl get configmap reserved-ip-config -o=jsonpath='{.data.ReservedIP2}' -n $NAMESPACE)
              if [ -z "$reserved_ip2" ]; then
                  fail "Second reserved ip not found in configmap"
              fi
              
              service_ip=$(kubectl get svc svc-test -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
              if [ -z "$service_ip" ]; then
                  fail "No service ip found for service svc-test"
              fi
              echo "{\"service_ip\": $service_ip}"
              echo "{\"reserved_ip\": $reserved_ip}"
              if [[ "$service_ip" == "$reserved_ip" ]]; then
                echo "IPs Match"
              else
                fail "IPs do not match: service=$service_ip reserved=$reserved_ip"
              fi              
            check:
              ($error == null): true
