# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: subnet-filtering-test
  labels:
    all:
spec:
  bindings:
    - name: fwname
      value: (join('-', ['ccm-fwtest', env('CLUSTER_NAME')]))
  namespace: "subnet-filtering-test"
  catch:
    - script:
        shell: bash
        shellArgs:
          - -c
        content: |
          set -euo pipefail
          echo "Test failed. Fetching CCM logs..."
          kubectl logs -n kube-system daemonsets/ccm-linode | grep "subnet-filtering-test" | tail -100
  steps:
    - name: Wait for each cluster's routes and check subnet isolation
      try:
        - script:
            shell: bash
            shellArgs:
              - -c
            timeout: 4m
            content: |
              set -euo pipefail
              source ../test/scripts/lib.sh

              if [ -z "$FIRST_CONFIG" ] || [ -z "$SECOND_CONFIG" ] || [ -z "$LINODE_TOKEN" ]; then
                  echo "Error: FIRST_CONFIG, SECOND_CONFIG, and LINODE_TOKEN environment variables must be set"
                  exit 1
              fi

              first_nodes=$(KUBECONFIG="$FIRST_CONFIG" kubectl get nodes -o json --request-timeout=15s)
              second_nodes=$(KUBECONFIG="$SECOND_CONFIG" kubectl get nodes -o json --request-timeout=15s)
              for nodes in "$first_nodes" "$second_nodes"; do
                jq -e '(.items | length > 0) and all(.items[];
                  (.spec.podCIDR // "") != "" and (.spec.providerID // "" | test("^linode://[0-9]+$")))' \
                  <<< "$nodes" > /dev/null
              done

              # Pair each cluster's nodes with the other cluster's pod CIDRs.
              # Each tab-separated row contains node, pod CIDR, provider ID, and foreign CIDRs as JSON.
              targets=$(jq -nr --argjson first "$first_nodes" --argjson second "$second_nodes" '
                [[$first, $second], [$second, $first]][] |
                (.[1].items | map(.spec.podCIDR) | tojson) as $foreign |
                .[0].items[] | [.metadata.name, .spec.podCIDR, .spec.providerID, $foreign] | @tsv
              ')

              check_route_state() {
                local observations=() node pod_cidr provider_id foreign_cidrs interfaces state result
                while IFS=$'\t' read -r node pod_cidr provider_id foreign_cidrs; do
                  interfaces=$(linode_cli linodes configs-list "${provider_id#linode://}" --json \
                    | jq -ce '.[0].interfaces') || return 1
                  state=$(jq -cn --arg node "$node" --arg cidr "$pod_cidr" \
                    --argjson foreign "$foreign_cidrs" --argjson interfaces "$interfaces" '
                    [$interfaces[] | select(.purpose == "vpc") | .ip_ranges[]?] as $ranges |
                    {
                      node: $node,
                      own_route_present: ($ranges | index($cidr) != null),
                      foreign_routes: [$ranges[] | select(. as $range | $foreign | index($range) != null)]
                    }
                  ')
                  if jq -e '.foreign_routes | length > 0' <<< "$state" >/dev/null; then
                    printf '[%s]\n' "$state"
                    return 0
                  fi
                  observations+=("$state")
                done <<< "$targets"

                result=$(printf '%s\n' "${observations[@]}" | jq -s '.')
                if jq -e 'all(.[]; .own_route_present)' <<< "$result" >/dev/null; then
                  printf '%s\n' "$result"
                  return 0
                fi
                return 1
              }

              retry 36 5 check_route_state
            check:
              ($error == null): true
              (length(json_parse($stdout)[?own_route_present == `false`])): 0
              (length(json_parse($stdout)[].foreign_routes[])): 0
